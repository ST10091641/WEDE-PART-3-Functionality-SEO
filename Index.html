<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>For The People | Community Gardening & Food Security</title>
    <meta
      name="description"
      content="For The People is a South African non-profit helping communities grow their own fresh, nutritious food through sustainable gardening, education and volunteer support."
    />
    <meta
      name="keywords"
      content="community garden, urban gardening, food security, sustainable gardening, volunteer South Africa, soil types, vegetable garden, non-profit gardening"
    />
    <meta name="author" content="For The People NPO" />
    <link rel="canonical" href="https://www.forthepeople.org/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="For The People | Community Gardening & Food Security" />
    <meta
      property="og:description"
      content="Empowering communities through sustainable gardening, fresh food, and agricultural education."
    />
    <meta property="og:site_name" content="For The People" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Mobile / theming -->
    <meta name="theme-color" content="#2f5d3a" />
    <meta name="robots" content="index, follow" />

    <!-- Basic security headers (client-side hints; real headers should also be set server-side) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://*.tile.openstreetmap.org; frame-src 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
